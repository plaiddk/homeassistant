l50_ultra_toggle_room_selection:
  alias: L50 Ultra – Toggle room selection
  mode: queued
  fields:
    room_id:
      name: Room ID
      description: Segment/room ID (number)
      selector:
        number:
          min: 1
          max: 99
          mode: box
  sequence:
    - variables:
        rid: "{{ room_id | int }}"
        text: "{{ states('input_text.l50_ultra_selected_segments') | string }}"
        list_str: "{{ text | regex_findall('[0-9]+') | list }}"
        list_int: "{{ list_str | map('int') | list }}"
        has: "{{ rid in list_int }}"
        new_list_str:
          "{% if has %} {{ list_str | reject('equalto', rid|string) |
          list }} {% else %} {{ (list_str + [rid|string]) | unique | list }} {% endif
          %}

          "
        joined: "{{ new_list_str | join(',') }}"
    - target:
        entity_id: input_text.l50_ultra_selected_segments
      data:
        value: "{{ joined }}"
      action: input_text.set_value
l50_ultra_clean_selected_rooms:
  alias: L50 Ultra – Clean selected rooms
  mode: single
  sequence:
    - variables:
        text: "{{ states('input_text.l50_ultra_selected_segments') | string }}"
        segs: "{{ text\n   | regex_findall('[0-9]+')\n   | map('int')\n   | list }}"
        suction:
          "{{ states('input_number.l50_ultra_global_idx_suction') | int(0)
          }}"
        cleaning_mode:
          "{{ states('input_number.l50_ultra_global_idx_mode') | int(0)
          }}"
        repeats:
          "{{ (states('input_number.l50_ultra_global_idx_times') | int(0))
          + 1 }}"
        water_volume:
          "{{ (states('input_number.l50_ultra_global_idx_mop') | int(0))
          + 1 }}"
        wetness:
          "{% set levels = [1, 16, 32] %} {% set i = states('input_number.l50_ultra_global_idx_mop')
          | int(0) %} {{ levels[i] }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ segs | count > 0 }}"
          sequence:
            - if:
                - condition: template
                  value_template:
                    "{{ states('switch.l50_ultra_customized_cleaning') ==
                    'off' }}"
              then:
                - action: switch.turn_on
                  target:
                    entity_id: switch.l50_ultra_customized_cleaning
                - delay:
                    milliseconds: 1000
            - variables:
                suction_list: "{{ [suction] * (segs | count) }}"
                water_list: "{{ [water_volume] * (segs | count) }}"
                wetness_list: "{{ [wetness] * (segs | count) }}"
                mode_list: "{{ [cleaning_mode] * (segs | count) }}"
                repeats_list: "{{ [repeats] * (segs | count) }}"
            - action: dreame_vacuum.vacuum_set_custom_cleaning
              target:
                entity_id: vacuum.l50_ultra
              data:
                segment_id: "{{ segs }}"
                suction_level: "{{ suction_list }}"
                water_volume: "{{ water_list }}"
                wetness_level: "{{ wetness_list }}"
                cleaning_mode: "{{ mode_list }}"
                repeats: "{{ repeats_list }}"
            - delay:
                milliseconds: 1000
            - action: dreame_vacuum.vacuum_clean_segment
              target:
                entity_id: vacuum.l50_ultra
              data:
                segments: "{{ segs }}"
      default:
        - action: vacuum.start
          target:
            entity_id: vacuum.l50_ultra
