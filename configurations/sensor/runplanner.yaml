rest:
  - resource: http://192.168.1.211:8089/api/routes
    scan_interval: 60
    headers:
      accept: application/json
    sensor:
      - name: RunPlanner Routes Count
        unique_id: runplanner_routes_count
        value_template: "{{ value_json | length }}"
        attribute_templates:
          data: "{{ value_json | tojson }}"
