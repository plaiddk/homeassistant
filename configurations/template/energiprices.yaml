- sensor:
    - name: "Today Mean Price"
      unique_id: sensor_today_mean_price
      unit_of_measurement: "DKK/kWh"
      state: "{{ state_attr('sensor.energi_data_service', 'today_mean') }}"
    - name: "Tomorrow Min Price"
      unique_id: sensor_tomorrow_min_price
      unit_of_measurement: "DKK/kWh"
      state: "{{ state_attr('sensor.energi_data_service', 'tomorrow_min').price }}"
    - name: "Finish In Relative"
      unique_id: sensor_finish_in_relative
      unit_of_measurement: "seconds"
      state: "{{ states('sensor.finish_in_relative') | int }}"
