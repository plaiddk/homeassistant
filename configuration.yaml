# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  internal_url: http://192.168.1.159:8123
  external_url: https://hacs.kaffeogkage.cc
  packages: !include_dir_merge_named configurations/packages/

#───────────────────────────────────────────────────────────────────────────────
# Frontend
#───────────────────────────────────────────────────────────────────────────────
frontend:
  themes: !include_dir_merge_named themes

#───────────────────────────────────────────────────────────────────────────────
# UI-managed files
#───────────────────────────────────────────────────────────────────────────────
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

#───────────────────────────────────────────────────────────────────────────────
# Integrations / split config
#───────────────────────────────────────────────────────────────────────────────
wake_on_lan:
python_script:
binary_sensor: !include_dir_merge_list configurations/binary_sensor
sensor: !include_dir_merge_list configurations/sensor
template: !include_dir_merge_list configurations/template

#───────────────────────────────────────────────────────────────────────────────
# Recorder – keep high-frequency / no-value entities out of the database
#───────────────────────────────────────────────────────────────────────────────
recorder:
  purge_keep_days: 10
  exclude:
    event_types:
      - call_service
    entities:
      - automation.cctv_loop
      - input_text.random_video_filename
      - sensor.time
      - sensor.date_time
      - sensor.system_monitor_memory_free
      - sensor.system_monitor_memory_use
    entity_globs:
      - sensor.santa_*

#───────────────────────────────────────────────────────────────────────────────
# Helpers
#───────────────────────────────────────────────────────────────────────────────
input_text:
  huskeliste_herman:
    name: Huskeliste Herman
    max: 255
  huskeliste_kamma:
    name: Huskeliste Kamma
    max: 255
  huskeliste_herman_next:
    name: Huskeliste Herman
    max: 255
  huskeliste_kamma_next:
    name: Huskeliste Kamma
    max: 255
  beskedliste_alle:
    name: beskederaula
    max: 255
  random_video_filename:
    name: Random Video Filename
    initial: a1.mp4
    max: 20

input_boolean:
  smart_wash:
    name: Smart Wash
    initial: false # Default state is off when Home Assistant starts - test
    icon: mdi:dishwasher
  smart_wash_vaskemaskine:
    name: Smart Wash2
    initial: false # Default state is off when Home Assistant starts
    icon: mdi:washing-machine
  wash_today:
    name: Wash Today
    initial: false # Default state is off when Home Assistant starts
    icon: mdi:dishwasher
  wash_today_vaskemaskine:
    name: Wash Today Vaskemaskine
    initial: false
    icon: mdi:washing-machine

input_number:
  climate_temperature:
    name: Climate Temperature
    min: 15.5
    max: 30
    step: 0.5
    mode: slider
  l50_ultra_global_idx_mode:
    name: L50 Ultra Global Idx Mode
    min: 0
    max: 2
    step: 1
    mode: box
    initial: 0
  l50_ultra_global_idx_suction:
    name: L50 Global Suction Index
    min: 0
    max: 10
    step: 1
    mode: box
  l50_ultra_global_idx_mop:
    name: L50 Global Mop Index
    min: 0
    max: 10
    step: 1
    mode: box
  l50_ultra_global_idx_times:
    name: L50 Global Times Index
    min: 0
    max: 10
    step: 1
    mode: box

input_select:
  runplanner_route:
    name: RunPlanner rute
    options:
      - "—" # placeholder, bliver erstattet automatisk

  washer_temperature:
    name: Washer Temperature
    options:
      - "30"
      - "40"
      - "60"
    initial: "40" # Default selected value
    icon: mdi:thermometer
  theme_selector:
    name: Theme Selector
    options:
      - Fluent Blue
      - Fluent Green
      - Fluent Orange
      - Fluent Purple
      - Fluent Red
      - Fluent Slate
      - Metro Blue
      - Metro Green
      - Metro Orange
      - Metro Purple
      - Metro Red
      - Metro Slate
      - MyTheme
    initial: Fluent Blue

#───────────────────────────────────────────────────────────────────────────────
# REST sensors
#───────────────────────────────────────────────────────────────────────────────
rest_command:
  runplanner_routes:
    url: http://192.168.1.211:8089/api/routes
    method: GET
    headers:
      accept: application/json

rest:
  # Santa Tracker
  - resource: "https://santa-api.appspot.com/info?client=web&language=en&fingerprint=&routeOffset=0&streamOffset=0"
    scan_interval: 60
    sensor:
      - name: "Santa Status"
        value_template: "{{ value_json.status }}"
        unique_id: santa_status

      - name: "Santa Takeoff Time"
        value_template: "{{ (value_json.takeoff / 1000) | timestamp_custom('%Y-%m-%d %H:%M:%S') }}"
        unique_id: santa_takeoff_time

      - name: "Santa Takeoff Time Friendly"
        value_template: "{{ (value_json.takeoff / 1000) | timestamp_custom('%-d %B %Y at %H:%M') }}"
        unique_id: santa_takeoff_time_friendly

      - name: "Santa Now Time"
        value_template: "{{ value_json.now }}"
        unique_id: santa_now_time

      - name: "Santa Duration"
        value_template: "{{ value_json.duration }}"
        unique_id: santa_duration

      - name: "Santa Current Location"
        value_template: "{{ value_json.location if 'location' in value_json else 'North Pole' }}"
        unique_id: santa_current_location
        json_attributes:
          - location
