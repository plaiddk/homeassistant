- id: runplanner_sync_select_names
  alias: "RunPlanner: Sync route names to dropdown"
  triggers:
    - entity_id: sensor.runplanner_routes_count
      trigger: state
    - trigger: homeassistant
      event: start
  actions:
    - variables:
        raw: "{{ state_attr('sensor.runplanner_routes_count', 'data') }}"
        routes: "{{ (raw | from_json if raw is string else raw) or [] }}"
        names: "{{ routes | map(attribute='name') | list }}"
    - target:
        entity_id: input_select.runplanner_route
      data:
        options: "{{ names if names|length>0 else ['—'] }}"
      action: input_select.set_options
  mode: single
- id: "1732746359999"
  alias: Opvask hvis tændt og lukkes
  description:
    Hvis opvaskemaskine tændes og lukkes, så klargøres opvask i den billigste
    time.
  triggers:
    - trigger: state
      entity_id:
        - input_boolean.smart_wash
      from: "off"
      to: "on"
  conditions:
    - condition: state
      entity_id: switch.011010524691008792_bsh_common_setting_powerstate
      state: "on"
    - condition: state
      entity_id: sensor.011010524691008792_bsh_common_status_operationstate
      state: BSH.Common.EnumType.OperationState.Ready
    - condition: state
      entity_id: binary_sensor.011010524691008792_bsh_common_status_doorstate
      state: "off"
  actions:
    - data: {}
      action: script.OpvaskemaskineStartScript
  mode: single
