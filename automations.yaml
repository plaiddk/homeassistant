- id: ev_smart_charging_follow_connection
  alias: EV Smart Charging – Follow Monta Connection
  triggers:
    - entity_id: binary_sensor.enyaq_charger_connected
      to:
        - "on"
        - "off"
      trigger: state
    - event: start
      trigger: homeassistant
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.platform == 'homeassistant' }}"
          sequence:
            - delay: 00:00:05
    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.enyaq_charger_connected
              state: "on"
          sequence:
            - target:
                entity_id:
                  - switch.ev_smart_charging_ev_connected
                  - switch.ev_smart_charging_smart_charging_activated
              action: switch.turn_on
        # Only switch off on a real disconnect, not when the API is briefly unavailable.
        - conditions:
            - condition: state
              entity_id: binary_sensor.enyaq_charger_connected
              state: "off"
          sequence:
            - target:
                entity_id:
                  - switch.ev_smart_charging_ev_connected
                  - switch.ev_smart_charging_smart_charging_activated
              action: switch.turn_off
  mode: restart
  initial_state: true
- alias: CCTV Loop
  id: cctv_video_loop_continuous
  description: Cycles randomly through local CCTV videos every 6 seconds.
  triggers:
    - trigger: time_pattern
      seconds: /6
  actions:
    - action: input_text.set_value
      target:
        entity_id: input_text.random_video_filename
      data:
        value: a{{ range(1, 4) | random }}.mp4
  mode: single
