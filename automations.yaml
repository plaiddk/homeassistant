- id: "1734942363531"
  alias: Badeværelse stor Dag og Nat
  description: ""
  triggers:
    - entity_id: binary_sensor.sensorstorbad_occupancy
      from: "off"
      to: "on"
      trigger: state
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: sun.sun
              state: above_horizon
          sequence:
            - target:
                area_id: storbad
              data:
                kelvin: 3750
                brightness_pct: 80
              action: light.turn_on
            - delay:
                minutes: 5
        - conditions:
            - condition: state
              entity_id: sun.sun
              state: below_horizon
          sequence:
            - target:
                area_id: storbad
              data:
                kelvin: 2446
                brightness_pct: 40
              action: light.turn_on
            - delay:
                minutes: 5
    - choose:
        - conditions:
            - condition: numeric_state
              entity_id: sensor.aqarastorbad_humidity
              above: 60
          sequence:
            - wait_for_trigger:
                - entity_id: sensor.aqarastorbad_humidity
                  below: 60
                  trigger: numeric_state
              timeout:
                minutes: 30
    - target:
        area_id: storbad
      action: light.turn_off
      data: {}
  mode: restart
